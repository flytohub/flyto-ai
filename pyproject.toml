[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flyto-ai"
version = "0.14.3"
description = "Open-source AI agent layer for natural-language workflow automation with runtime-discovered modules and reusable YAML recipes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["ai-agent", "ai-agent-framework", "automation", "workflow-automation", "llm", "workflow", "mcp", "browser-automation", "openai", "anthropic", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "flyto-core[browser]>=2.16.1",
    "flyto-pro-core>=0.1.0",
    "flyto-blueprint>=0.1.0",
    "langdetect>=1.0.9",
    "aiosqlite>=0.19.0",
    "rich>=13.0",
    "cryptography>=46.0.7",
]

[project.optional-dependencies]
lite = ["pyyaml>=6.0", "pydantic>=2.0.0"]
serve = ["aiohttp>=3.8"]
# The native coding control plane uses the normal Flyto provider stack.  The
# Claude SDK remains an explicitly detachable compatibility backend.
agent = ["claude-agent-sdk>=0.1.0"]
claude-sdk = ["claude-agent-sdk>=0.1.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.8.0"]

[project.scripts]
flyto-ai = "flyto_ai.cli:main"
flyto-ai-mcp = "flyto_ai.mcp_server:main"
flyto-closed-loop-mcp = "flyto_ai.closed_loop_mcp:main"

[project.urls]
Homepage = "https://flyto2.com"
Documentation = "https://docs.flyto2.com"
Repository = "https://github.com/flytohub/flyto-ai"
Issues = "https://github.com/flytohub/flyto-ai/issues"
Changelog = "https://github.com/flytohub/flyto-ai/blob/main/CHANGELOG.md"
Security = "https://github.com/flytohub/flyto-ai/blob/main/SECURITY.md"
Blog = "https://blog.flyto2.com/posts/ai-workflow-automation-alternatives"
Examples = "https://docs.flyto2.com/ai/"

[tool.hatch.build.targets.wheel]
packages = ["flyto_ai"]
