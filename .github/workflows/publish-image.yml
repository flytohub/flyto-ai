name: Publish sandbox image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: flyto-ai-sandbox

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Flyto AI Sandbox
            org.opencontainers.image.description=Sandbox runtime for Flyto AI workflow generation and self-repair
            org.opencontainers.image.url=https://flyto2.com
            org.opencontainers.image.source=https://github.com/flytohub/flyto-ai
            org.opencontainers.image.documentation=https://docs.flyto2.com
            org.opencontainers.image.vendor=Flyto

      - uses: docker/build-push-action@v5
        with:
          context: flyto_ai/sandbox
          file: flyto_ai/sandbox/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
