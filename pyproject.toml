[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flyto-ai"
version = "0.18.0"
description = "Open-source AI agent layer for natural-language workflow automation with runtime-discovered modules and reusable YAML recipes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["ai-agent", "ai-agent-framework", "automation", "workflow-automation", "llm", "workflow", "mcp", "browser-automation", "openai", "anthropic", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "langdetect>=1.0.9",
    "aiosqlite>=0.19.0",
    "rich>=13.0",
    "cryptography>=46.0.7",
]

[project.optional-dependencies]
lite = ["pyyaml>=6.0", "pydantic>=2.0.0"]
serve = ["aiohttp>=3.8"]
# These four were unconditional base deps through 0.15.0. Every call site
# that touches them (pro_bridge, planner's Blueprint lookups, the Anthropic
# provider, robotics-adjacent Core tooling) already lazily imports and
# try/excepts ImportError — nothing in flyto_ai needs them present to import
# the package. The only thing that ever needed them unconditionally was
# pip's resolver, and flyto-core[browser] alone drags in Playwright plus a
# Chrome download, which is what made flyto-ai uninstallable in a slim
# image that only wants e.g. OpenAIProvider. Split into extras so a light
# install stays light; "full" reproduces the pre-0.16.0 base exactly.
#
# The two sibling floors are exact, not nominal:
#
# `flyto-core[browser]>=2.31.0` — the first Core release containing the three
# declared deterministic domain-solver capabilities. The independent security
# minimum is not maintained by hand:
# tests/test_stack_security_floor.py derives it from Core's own
# security/advisories.json. It moved from 2.28.1 the day after it was set,
# because Core published five more advisories — one critical — affecting
# <= 2.28.1, which is exactly the event the derived-not-restated design exists
# for. Nothing in flyto_ai checks a Core version at runtime, so an environment
# already holding an old Core would otherwise satisfy this and run anyway.
#
# `flyto-blueprint>=0.3.0` — `tools/blueprint_tools.py` decides whether to pass
# host-derived `available_module_ids` by inspecting the engine signature, and an
# engine without it is called exactly as before, i.e. unfiltered. Blueprint
# 0.2.2 has no such parameter, so with the old `>=0.1.0` floor the module
# availability gate was silently off for every install resolved from PyPI. A
# floor is the only thing that makes a signature-probed feature reachable.
anthropic = ["anthropic>=0.20.0"]
browser = ["flyto-core[browser]>=2.31.0"]
pro = ["flyto-pro-core>=0.1.0"]
blueprint = ["flyto-blueprint>=0.3.0"]
full = [
    "anthropic>=0.20.0",
    "flyto-core[browser]>=2.31.0",
    "flyto-pro-core>=0.1.0",
    "flyto-blueprint>=0.3.0",
]
# The native coding control plane uses the normal Flyto provider stack.  The
# Claude SDK remains an explicitly detachable compatibility backend.
agent = ["claude-agent-sdk>=0.1.0"]
claude-sdk = ["claude-agent-sdk>=0.1.0"]
# Same four packages as `full`, listed again rather than referenced: dev/CI
# needs the complete feature surface to test Blueprint, Pro and the Anthropic
# provider, which the base install no longer carries for free now that those
# are extras. Core's `api` extra is development-only: the locked sibling source
# contract imports Core's API surface during test collection. Keep the public
# `browser` and `full` surfaces browser-only so they do not acquire Core's API
# server dependencies. Found by running the real test suite against a bare
# `[dev]` install, not assumed — test_benchmarking_v3.py (flyto_blueprint) and
# manual_tg_test.py (aiohttp, the pre-existing `serve` extra) both broke
# collection the moment the split landed.
dev = [
    "pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.8.0",
    "claude-agent-sdk>=0.1.0",
    "anthropic>=0.20.0",
    "flyto-core[browser,api]>=2.31.0",
    "flyto-pro-core>=0.1.0",
    "flyto-blueprint>=0.3.0",
]

[project.scripts]
flyto-ai = "flyto_ai.cli:main"
flyto-ai-mcp = "flyto_ai.mcp_server:main"
flyto-closed-loop-mcp = "flyto_ai.closed_loop_mcp:main"

[project.urls]
Homepage = "https://flyto2.com"
Documentation = "https://docs.flyto2.com"
Repository = "https://github.com/flytohub/flyto-ai"
Issues = "https://github.com/flytohub/flyto-ai/issues"
Changelog = "https://github.com/flytohub/flyto-ai/blob/main/CHANGELOG.md"
Security = "https://github.com/flytohub/flyto-ai/blob/main/SECURITY.md"
Blog = "https://blog.flyto2.com/posts/ai-workflow-automation-alternatives"
Examples = "https://docs.flyto2.com/ai/"

[tool.hatch.build.targets.wheel]
packages = ["flyto_ai"]
